services:
  n8n_target:
    image: n8nio/n8n:latest
    container_name: n8n_lab_target
    ports:
      - "5678:5678"
    networks:
      - lab_network
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=attack_me_123
      - WEBHOOK_URL=https://db14-2401-e180-8841-85de-2989-2a14-7d57-eee8.ngrok-free.app
    volumes:
      - n8n_data:/home/node/.n8n

  attacker_node:
    image: python:3.10-slim
    container_name: python_attacker
    volumes:
      - ..:/scripts
    networks:
      - lab_network
    tty: true
    stdin_open: true

networks:
  lab_network:
    driver: bridge

volumes:
  n8n_data: